<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu Dropdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 50px;
        }

        ul {
            list-style-type: none;
        }

        .main-menu {
            display: flex;
            background-color: #161615;
            width: 100%;
            max-width: 800px;
        }

        .main-menu > li {
            position: relative;
        }

        .main-menu a {
            display: block;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            padding: 20px 35px;
            border: 3px solid #aad4af;
            margin-right: -3px;
        }

        .main-menu a:hover {
            background-color: #333333;
        }

        .sub-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 250px;
            z-index: 10;
        }

        .sub-menu a {
            margin-top: -3px; 
            margin-right: 0;
        }

        .main-menu li:hover > .sub-menu {
            display: block; 
        }

        .sub-menu-level-2 {
            display: none;
            position: absolute;
            top: 0;
            left: 100%;
            width: 200px;
        }

        .sub-menu li:hover > .sub-menu-level-2 {
            display: block;
        }

    </style>
</head>
<body>

    <ul class="main-menu">
        <li><a href="#">Home</a></li>
        <li>
            <a href="#">Web Design</a>
            <ul class="sub-menu">
                <li><a href="#">Resources</a></li>
                <li><a href="#">Links</a></li>
                <li>
                    <a href="#">Tutorials</a>
                    <ul class="sub-menu-level-2">
                        <li><a href="#">HTML/CSS</a></li>
                        <li><a href="#">jQuery</a></li>
                    </ul>
                </li>
            </ul>
        </li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
    </ul>

</body>
</html>
